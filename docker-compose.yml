services:
  mysql:
    image: mysql:8.0
    container_name: identity-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: identity_service
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DBMS_CONNECTION: jdbc:mysql://mysql:3306/identity_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DBMS_USERNAME: root
      DBMS_PASSWORD: root
      JWT_SIGNER_KEY: but75kvdatab3cqvos454bs761fb6i0y
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "8080:8080"

volumes:
  mysql_data:
